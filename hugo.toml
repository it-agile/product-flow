baseURL = 'https://it-team-flow.de/'
languageCode = 'de-de'
title = 'it-team-flow'

# Kategorien und Schlagworte werden nirgends benutzt. Ohne diese Zeile erzeugt
# Hugo trotzdem /categories/ und /tags/ und listet sie in der sitemap.xml.
# 'section' betrifft die automatische Uebersichtsseite /blog/. Fuer sie gibt es
# kein Layout, sie landete aber in der Sitemap und antwortete dort mit 404.
disableKinds = ['taxonomy', 'term', 'section']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  # Anmeldung zum Webinar. Wird an sechs Stellen verwendet: fuenf Schaltflaechen
  # auf der Startseite und Verweise in vier Blogartikeln, alle ueber diese eine
  # Einstellung. Vor dem Aendern die Erreichbarkeit pruefen: die vorige
  # Anmeldung (Kennung WN_N_4awQcYTfu5N10W7sXCcw) lief unbemerkt auf HTTP 404,
  # zwischenzeitlich stand hier ein mailto als Notloesung.
  # Geprueft am 02.09.2026: HTTP 200, Thema "Die Flow Manager Rolle".
  webinar_url = "https://us02web.zoom.us/webinar/register/WN_KjefFAgdS1KaG3SXIWI3OA#/registration"
